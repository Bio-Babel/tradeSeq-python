[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradeSeq-python"
version = "1.13.12"
description = "Python port of the R tradeSeq package (tracks statOmics/tradeSeq 1.13.12 @ 02a9050) — trajectory-based differential expression analysis (NB-GAM)"
license = "Artistic-2.0"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "tradeSeq port"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "anndata>=0.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "tqdm>=4.0",
    "ggplot2-python>=4",
    "patchwork-python>=1.3",
    "pheatmap-python>=1.0"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
docs = ["mkdocs", "mkdocstrings[python]", "mkdocs-material", "mkdocs-jupyter"]

# biobabel producer contract. The load-bearing line is the biobabel.manifest
# entry point — biobabel discovers the package by iterating that group and
# calling get_manifest(). [tool.biobabel] is convenience metadata only.
[tool.biobabel]
contract_class = "analysis"

[project.entry-points."biobabel.manifest"]
tradeseq = "tradeseq._biobabel:get_manifest"

[tool.hatch.build.targets.wheel]
packages = ["tradeseq"]
include = [
  "tradeseq/resources/*.h5ad",
  "tradeseq/py.typed",
  "tradeseq/_biobabel/**/*.yaml",
  "tradeseq/_biobabel/**/*.md",
  "tradeseq/_biobabel/**/*.py",
]

[tool.hatch.build.targets.sdist]
include = [
  "tradeseq/**",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
exclude = [
  "tradeseq/.ipynb_checkpoints/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
