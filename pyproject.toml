[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradeSeq-python"
version = "1.13.12"
description = "Python port of the R tradeSeq package (tracks statOmics/tradeSeq 1.13.12 @ 02a9050) — trajectory-based differential expression analysis (NB-GAM)"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "tradeSeq port"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "anndata>=0.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "tqdm>=4.0",
    "ggplot2-python>=4",
    "patchwork-python>=1.3",
    "pheatmap-python>=1.0",
    "scales-python>=1.4",
    "rgrid-python>=4.5",
    "gtable-python>=0.3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
docs = ["mkdocs", "mkdocstrings[python]", "mkdocs-material", "mkdocs-jupyter"]

[tool.hatch.build.targets.wheel]
packages = ["tradeseq"]
include = [
  "tradeseq/resources/*.h5ad",
  "tradeseq/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
  "tradeseq/**",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
exclude = [
  "tradeseq/.ipynb_checkpoints/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
